// Çeviri
async function translateText(text) {
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=tr&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        return data[0].map(x => x[0]).join('');
    } catch { return text; }
}

async function fetchWiki(pageTitle, type) {
    const descEl = document.getElementById(`${type}-desc`);
    const imgEl = document.getElementById(`${type}-img`);
    const linkEl = document.getElementById(`${type}-link`);

    try {
        let res = await fetch(`https://tr.wikipedia.org/api/rest_v1/page/summary/${pageTitle}`);
        let data = await res.json();
        let isTranslated = false;

        if (data.status === 404 || !data.extract) {
            res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${pageTitle}`);
            data = await res.json();
            if (data.extract) {
                data.extract = await translateText(data.extract);
                isTranslated = true;
            }
        }

        descEl.innerHTML = (isTranslated ? '<span class="translation-tag">🌐 Otomatik Çeviri</span><br>' : '') + data.extract;
        
        if (data.thumbnail) {
            imgEl.src = data.thumbnail.source;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        // Linkleri güncelle ve göster
        linkEl.href = data.content_urls.desktop.page;
        linkEl.style.display = 'inline-block';

    } catch (e) {
        descEl.textContent = "Veri alınamadı.";
        linkEl.style.display = 'none';
    }
}

// Sinematik ve Yavaş Geçiş
function updateAll(item) {
    map.flyTo([item.lat, item.lng], 12, {
        animate: true,
        duration: 5, // Daha da yavaşlattık (3.5 saniye)
        easeLinearity: 0.2
    });

    document.getElementById('archi-name').textContent = item.name;
    document.getElementById('work-name').textContent = item.work;
    document.getElementById('archi-desc').innerHTML = '<span class="loader">Yükleniyor...</span>';
    document.getElementById('work-desc').innerHTML = '<span class="loader">Yükleniyor...</span>';
    
    fetchWiki(item.wikiName, 'archi');
    fetchWiki(item.wikiWork, 'work');
}
